name: Release

# Every push to main that changes the program publishes a new version automatically:
# the next number after the latest release (3.0 → 3.1 → 3.2 …). To jump to a bigger
# number, write it into VERSION. Add [skip release] to a commit message to skip.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "docs/releases/**"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          case "$HEAD_MSG" in *"[skip release]"*) echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0;; esac
          LAST="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)"
          LASTV="${LAST#v}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VER="${GITHUB_REF_NAME#v}"
            git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          else
            FILEV="$(tr -d ' \r\n' < VERSION)"
            # newer of VERSION and (latest release + 0.1)
            VER="$(python3 - "$LASTV" "$FILEV" <<'PY'
          import sys
          p = lambda v: [int(x) for x in (v or "0").split(".")] + [0, 0]
          last, file = sys.argv[1], sys.argv[2]
          if not last:
              print(file); sys.exit()
          a = p(last)
          nxt = f"{a[0]}.{a[1] + 1}"
          print(file if p(file)[:3] > p(nxt)[:3] else nxt)
          PY
          )"
          fi
          echo "Latest release: ${LAST:-none}, new version: $VER"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "TAG=v$VER" >> "$GITHUB_ENV"
          echo "LAST=$LAST" >> "$GITHUB_ENV"
          if gh release view "v$VER" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VER already exists, nothing to do"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.ver.outputs.skip != '1'
        with:
          go-version: "1.24"

      - name: Vet and test
        if: steps.ver.outputs.skip != '1'
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          go test ./...

      - name: Build
        if: steps.ver.outputs.skip != '1'
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-H windowsgui -s -w -X main.appVersion=$VER" \
            -o "dist/Телефон на ПК.exe" .

      - name: Get latest scrcpy
        if: steps.ver.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R Genymobile/scrcpy -p 'scrcpy-win64-*.zip' -D scrcpy-dl
          ls scrcpy-dl

      - name: Package
        if: steps.ver.outputs.skip != '1'
        run: |
          python3 - <<'PY'
          import glob, os, zipfile
          ver = os.environ["VER"]
          top = f"TVPhone-{ver}/"
          src = zipfile.ZipFile(glob.glob("scrcpy-dl/scrcpy-win64-*.zip")[0])
          out = zipfile.ZipFile(f"dist/TVPhone-{ver}.zip", "w", zipfile.ZIP_DEFLATED, compresslevel=9)
          for info in src.infolist():
              if info.is_dir():
                  continue
              name = info.filename.split("/", 1)[-1]  # drop scrcpy's own top folder
              if "/" in name or not name:
                  continue
              out.writestr(top + name, src.read(info))
          out.write("dist/Телефон на ПК.exe", top + "Телефон на ПК.exe")
          text = open("docs/Как пользоваться.txt", encoding="utf-8").read().replace("\r\n", "\n").replace("\n", "\r\n")
          out.writestr(top + "Как пользоваться.txt", "﻿" + text)
          out.close()
          print(out.filename, os.path.getsize(f"dist/TVPhone-{ver}.zip"))
          PY

      - name: Publish release
        if: steps.ver.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "docs/releases/$VER.md" ]; then
            cp "docs/releases/$VER.md" notes.md
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            git tag -l --format='%(contents)' "$TAG" | sed '/-----BEGIN PGP/,$d' > notes.md
          elif [ -n "$LAST" ] && git rev-parse -q --verify "refs/tags/$LAST" >/dev/null; then
            # what changed since the previous release: commit titles
            git log --no-merges --format='- %s' "$LAST..HEAD" | grep -v '\[skip release\]' > notes.md || true
          fi
          [ -s notes.md ] || echo "TVPhone $VER" > notes.md
          gh release create "$TAG" "dist/TVPhone-$VER.zip" --target "$GITHUB_SHA" \
            --title "TVPhone $VER" --notes-file notes.md --latest
